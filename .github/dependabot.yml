version: 2
updates:
  # Keeps the 'uses:' action versions pinned in .github/workflows/lint.yml
  # (actions/checkout, etc.) current -- without this, those versions only
  # ever get bumped manually.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A new action release is not proposed until it has been out for this
    # many days. This is actually Dependabot's own default even when
    # 'cooldown' is omitted entirely -- it's declared explicitly here so the
    # policy is visible in this file rather than relying on undocumented
    # default behavior that could change.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
